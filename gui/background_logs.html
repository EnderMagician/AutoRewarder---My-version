<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Background Logs</title>

  <link rel="stylesheet" href="normalize.css">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="background_logs.css">
</head>
<body>

  <main class="logs-shell">
    <header class="logs-header">
      <div><p>Headless runner</p><h1>Background logs</h1></div>
      <button id="logs_refresh" class="logs-refresh" type="button">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-2.64-6.36"></path><polyline points="21 3 21 9 15 9"></polyline></svg>
        Refresh
      </button>
    </header>
    <p class="logs-intro">Output from scheduled and headless runs, newest at the bottom (last 1000 lines).</p>
    <section id="logs_panel" class="logs-panel" aria-live="polite">
      <pre id="logs_content" class="logs-content">Loading…</pre>
    </section>
  </main>

  <script>
    const logsContent = document.getElementById('logs_content');
    const logsPanel = document.getElementById('logs_panel');
    const refreshButton = document.getElementById('logs_refresh');

    function set_logs_message(message, className) {
      logsContent.className = 'logs-content' + (className ? ' ' + className : '');
      logsContent.textContent = message;
    }

    async function load_background_logs() {
      refreshButton.disabled = true;

      const wasAtBottom =
        logsPanel.scrollHeight - logsPanel.scrollTop - logsPanel.clientHeight < 24;

      try {
        const result = await pywebview.api.get_background_logs();

        if (!result || result.ok !== true) {
          const errorMessage =
            result && result.error
              ? result.error
              : 'Could not load background logs.';

          set_logs_message(errorMessage, 'logs-error');
          return;
        }

        if (!result.content) {
          set_logs_message('No background logs yet.', 'logs-empty');
        } else {
          set_logs_message(result.content, '');
          if (wasAtBottom) logsPanel.scrollTop = logsPanel.scrollHeight;
        }
      } catch (error) {
        console.error('Failed to load background logs:', error);
        set_logs_message('Could not load background logs.', 'logs-error');
      } finally {
        refreshButton.disabled = false;
      }
    }

    refreshButton.addEventListener('click', load_background_logs);

    window.addEventListener('pywebviewready', load_background_logs);
  </script>

</body>
</html>
